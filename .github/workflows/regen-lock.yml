name: Regenerate pinned lockfile

on:
  push:
    branches: [chore/lock-dependencies]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event.head_commit.message != 'chore: regenerate pinned lockfile' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "chore: regenerate pinned lockfile"
          git push origin chore/lock-dependencies
